name: Cập nhật bài Substack

on:
  schedule:
    - cron: "17 23 * * *"   # 6h17 sáng giờ Việt Nam mỗi ngày
  workflow_dispatch:        # cho phép bấm chạy tay
  push:
    paths: ["data.js"]      # chạy lại khi bạn sửa link Substack

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_posts.py
      - name: Lưu posts.json nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Cập nhật bài Substack nổi bật" && git push)
